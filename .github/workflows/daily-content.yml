name: Conteúdo diário (SEO/GEO/AEO)

# Publica ate 2 novas paginas por dia a partir de content/queue.json
# e envia um e-mail com os links. Roda 12:00 UTC (09:00 BRT) + disparo manual.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar ate 2 paginas e coletar os slugs publicados
        run: |
          : > /tmp/pub.txt
          for i in 1 2; do
            OUT="$(python3 scripts/gen_daily_page.py)"
            echo "$OUT"
            echo "$OUT" | awk '/^PUBLISHED/{print $2}' >> /tmp/pub.txt
          done
          echo "Publicados nesta rodada:"; cat /tmp/pub.txt

      - name: Commit e push (se houver pagina nova)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "Matilab Content Bot"
            git config user.email "bot@matilab.com.br"
            git add -A
            git commit -m "content: nova pagina diaria de SEO/GEO/AEO [skip ci]"
            git push
          else
            echo "Nada novo para publicar."
          fi

      - name: Montar o e-mail
        id: mail
        run: python3 scripts/email_report.py /tmp/pub.txt >> "$GITHUB_OUTPUT"

      - name: Enviar e-mail com os links
        if: steps.mail.outputs.has_new == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Matilab Conteúdo <${{ secrets.MAIL_USERNAME }}>
          to: matheusmoura.co@gmail.com
          subject: ${{ steps.mail.outputs.subject }}
          html_body: ${{ steps.mail.outputs.body }}
